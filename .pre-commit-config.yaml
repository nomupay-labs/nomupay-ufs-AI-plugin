# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3
# Define a global exclude pattern for AI-generated, openspec, and plugin agent/skill folders
exclude: '^(openspec/|\.github/(skills|prompts|agents|commands)/|plugins/.+/(agents|agents-claude|skills)/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: "package-lock.json"
      - id: trailing-whitespace
        exclude: \.svg$
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces to replace line ending by the UNIX 'lf' character
        exclude: \.svg$
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-yaml
        exclude: mkdocs.yml
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python.git
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/igorshubovych/markdownlint-cli.git
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [ "--fix", "--config", ".markdownlint.json" ]
        exclude: '\.github/'
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-github-actions
